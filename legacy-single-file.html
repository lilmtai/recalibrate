<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Recalibrate</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one calm column. Day timeline on the left, "now" panel on the right; stacks on phones. */
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --sunk:#E8ECEA; --line:#D9DFDC;
  --fg:#18201E; --muted:#5F6B67; --faint:#8C9793;
  --accent:#2E5E57; --accent-soft:#DCE8E5; --accent-fg:#FFFFFF;
  --warn:#9A5B1E; --warn-soft:#F5E9DB; --good:#3C7A4E; --good-soft:#E0EEE3;
  --e-low:#B9CFC9; --e-med:#7FA79E; --e-high:#2E5E57;
  --display:"Instrument Serif", Georgia, serif;
  --body:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121816; --surface:#1A2220; --sunk:#151C1A; --line:#2A3532;
  --fg:#E6ECEA; --muted:#9AA8A3; --faint:#6E7C78;
  --accent:#7DB8AD; --accent-soft:#22332F; --accent-fg:#0E1513;
  --warn:#E0A86A; --warn-soft:#33281C; --good:#86C79A; --good-soft:#1C2E22;
  --e-low:#2D3F3B; --e-med:#4D746B; --e-high:#7DB8AD; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121816; --surface:#1A2220; --sunk:#151C1A; --line:#2A3532;
  --fg:#E6ECEA; --muted:#9AA8A3; --faint:#6E7C78;
  --accent:#7DB8AD; --accent-soft:#22332F; --accent-fg:#0E1513;
  --warn:#E0A86A; --warn-soft:#33281C; --good:#86C79A; --good-soft:#1C2E22;
  --e-low:#2D3F3B; --e-med:#4D746B; --e-high:#7DB8AD; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(32px,6vw,44px);line-height:1.05;margin:4px 0 0;text-wrap:balance}
h1 em{color:var(--muted)}
h2{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:999px;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0/.08)}

.checkin{display:flex;gap:16px 28px;flex-wrap:wrap;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);font-size:14px}
.checkin .lbl{color:var(--muted);margin-right:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 11px;font-size:13px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.sleep{width:64px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-family:var(--mono);font-size:13px}

.banner{margin-top:16px;padding:12px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--fg);font-size:14px;display:flex;gap:10px;align-items:flex-start}
.banner b{color:var(--warn);font-weight:600}
.banner.calm{background:var(--accent-soft)}
.banner.calm b{color:var(--accent)}

.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;margin-top:20px}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}.side{order:-1}}

.sechead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:8px;font-size:14px}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.small{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}

/* timeline */
.timeline{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.hour{position:absolute;left:0;right:0;border-top:1px solid var(--sunk);font-family:var(--mono);font-size:11px;color:var(--faint);padding:2px 0 0 10px}
.block{position:absolute;border:0;text-align:left;border-radius:7px;padding:6px 10px;overflow:hidden;background:var(--accent-soft);color:var(--fg);border-left:3px solid var(--e-med);font-size:13px;line-height:1.3;display:flex;flex-direction:column;gap:1px}
.block .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.block .m{font-family:var(--mono);font-size:11px;color:var(--muted)}
.block[data-e="low"]{border-left-color:var(--e-low)}
.block[data-e="high"]{border-left-color:var(--e-high)}
.block.done{background:var(--good-soft);opacity:.75}
.block.done .t{text-decoration:line-through;text-decoration-color:var(--faint)}
.block.missed{background:var(--warn-soft);opacity:.8}
.block.dim{opacity:.55}
.block:hover{filter:brightness(.97)}
.block .chip.ex{font-size:10px;padding:0 6px;line-height:1.5;vertical-align:1px}
.block .t{line-height:1.25}
.cue{position:absolute;right:8px;max-width:46%;font-size:11px;font-family:var(--mono);color:var(--warn);background:var(--surface);border:1px dashed var(--warn);border-radius:6px;padding:1px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transform:translateY(-50%);z-index:2}
.nowline{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--accent);z-index:3}
.nowline::before{content:"";position:absolute;left:-1px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.passed{position:absolute;left:0;right:0;top:0;background:var(--bg);opacity:.45;pointer-events:none;z-index:1}

/* side */
.side{display:flex;flex-direction:column;gap:20px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.now .when{font-family:var(--mono);font-size:12px;color:var(--muted)}
.now .what{font-family:var(--display);font-size:28px;line-height:1.1;margin:4px 0 6px}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin:10px 0 4px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:3px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--sunk);font-size:14px}
.list li:first-child{border-top:0}
.time{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:44px;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.ex{background:none;border:1px dashed var(--faint)}
.muted{color:var(--muted)}
.small{font-size:13px}

.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty .what{font-family:var(--display);font-size:26px;color:var(--fg);margin-bottom:6px}
.empty .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}

/* playbook */
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:16px}
.rule .if{font-size:13px;color:var(--muted)}
.rule .then{font-family:var(--display);font-size:22px;line-height:1.2;margin:6px 0 10px}
.rule .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.intro{max-width:62ch;color:var(--muted);margin:16px 0 0}

/* patterns */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px}
@media (max-width:620px){.stats{grid-template-columns:minmax(0,1fr)}}
.stat .v{font-family:var(--display);font-size:40px;line-height:1}
.stat .k{font-size:13px;color:var(--muted);margin-top:6px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:14px}
@media (max-width:820px){.two{grid-template-columns:minmax(0,1fr)}}
.hbar{display:grid;grid-template-columns:140px minmax(0,1fr) 36px;gap:10px;align-items:center;font-size:14px;padding:5px 0}
.hbar .track{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--warn);border-radius:5px}
.hbar.acc .track i{background:var(--accent)}
.hbar .n{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
.insight{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--sunk);font-size:15px}
.insight:first-of-type{border-top:0}
.insight .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:9px;flex:none}
.coachtext{white-space:pre-wrap;font-size:15px;margin-top:10px}

/* sheet */
.overlay{position:fixed;inset:0;background:rgb(10 16 14/.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.overlay{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:20px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.sheet{border-radius:16px}}
.sheet h3{font-family:var(--display);font-weight:400;font-size:28px;margin:0 0 4px;line-height:1.1}
.field{display:flex;flex-direction:column;gap:5px;margin-top:14px;font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:15px;color:var(--fg)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>.field{flex:1 1 120px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pick{border:1px solid var(--line);background:var(--bg);padding:6px 12px;border-radius:999px;font-size:14px}
.pick[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.fixes{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.fixes .pick{border-radius:8px;text-align:left}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:20px}
.actions .spacer{flex:1}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.sync{font-family:var(--mono);font-size:11px;color:var(--faint)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(12px);opacity:.6}}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <div class="brand">Recalibrate <span class="sync" id="sync"></span></div>
      <h1 id="title">Today</h1>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="today" aria-selected="true">Today</button>
      <button role="tab" data-tab="playbook" aria-selected="false">Playbook</button>
      <button role="tab" data-tab="patterns" aria-selected="false">Patterns</button>
    </nav>
  </header>
  <main id="view"></main>
</div>
<div id="layer"></div>

<script>
/* ---------- constants ---------- */
const BARRIERS = [
  {k:"energy",l:"Low energy"},{k:"bloated",l:"Bloated / hungry"},{k:"overwhelm",l:"Overwhelmed"},
  {k:"time",l:"Lost track of time"},{k:"forgot",l:"Forgot"},{k:"avoid",l:"Avoiding it"},
  {k:"sleep",l:"Poor sleep"},{k:"cameup",l:"Something came up"}];
const BL = Object.fromEntries(BARRIERS.map(b=>[b.k,b.l]));
const FIXES = {
  energy:[["Small snack with protein",60],["10-minute walk outside first",30],["Do the minimum version only",15]],
  bloated:[["Eat a light meal earlier",90],["Keep lunch light on these days",240],["Water, no food, in the last hour",60]],
  overwhelm:[["Write the first 2-minute step",30],["Cut scope to the minimum version",15],["Start a 25-min timer, stop after",10]],
  time:[["Transition alarm: wrap up",10],["Block a 15-min buffer before",15],["Put a visual timer on screen",30]],
  forgot:[["Lay out what you need",720],["Phone reminder at the door",30],["Stack it after an existing habit",15]],
  avoid:[["Name the hard part, do it for 5 min",10],["Line up a reward for after",30],["Commit to just showing up",15]],
  sleep:[["Screens off and phone out of bedroom",720],["Move hard work to tomorrow morning",60]],
  cameup:[["Pick a new slot right away",15],["Keep 20% of the day unbooked",120]]};
const LEADS = [10,15,30,60,90,120,240,720];
const leadLabel = m => m>=720?"night before":m>=60?(m/60)+" h before":m+" min before";
const ENERGY = {low:"Low",med:"Medium",high:"High"};
const HOUR_PX = 56;

/* ---------- state + storage ---------- */
const blank = () => ({tasks:[],rules:[],checkins:{},v:1});
let S = blank(), dbRef = null, saveTimer = null, tab = "today", sampler = null;
const LKEY = "recalibrate.v1";
try{ const raw = localStorage.getItem(LKEY); if(raw) S = Object.assign(blank(), JSON.parse(raw)); }catch(e){}
try{ const t = localStorage.getItem(LKEY+".tab"); if(t) tab = t; }catch(e){}
if(["today","playbook","patterns"].includes(location.hash.slice(1))) tab = location.hash.slice(1);

function save(){
  try{ localStorage.setItem(LKEY, JSON.stringify(S)); }catch(e){}
  if(!dbRef) return;
  clearTimeout(saveTimer);
  setSync("Saving…");
  saveTimer = setTimeout(async()=>{
    try{ await dbRef.set(JSON.parse(JSON.stringify(S))); setSync("Saved to your account"); }
    catch(e){ setSync("Saved on this device only"); }
  }, 700);
}
function setSync(t){ document.getElementById("sync").textContent = t ? "· "+t : ""; }

(async()=>{
  if(!window.claude?.use) { setSync("Saved on this device"); return; }
  try{
    const [db,user] = await Promise.all([claude.use("db"), claude.use("user")]);
    sampler = await claude.use("sample");
    render();
    const id = user ? await user.id() : null;
    if(!db || !id){ setSync("Saved on this device"); return; }
    dbRef = db.collection("data/users/"+id).doc("planner");
    const snap = await dbRef.get();
    if(snap.exists){ S = Object.assign(blank(), snap.data()); try{localStorage.setItem(LKEY,JSON.stringify(S))}catch(e){} render(); setSync("Synced"); }
    else if(S.tasks.length){ save(); }
    else setSync("Synced");
  }catch(e){ setSync("Saved on this device"); }
})();

/* ---------- helpers ---------- */
const uid = () => Math.random().toString(36).slice(2,10);
const pad = n => String(n).padStart(2,"0");
const dkey = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today = () => dkey(new Date());
const addDays = (k,n) => { const [y,m,d]=k.split("-").map(Number); return dkey(new Date(y,m-1,d+n)); };
const toMin = hhmm => { const [h,m]=hhmm.split(":").map(Number); return h*60+m; };
const fmt = min => pad(Math.floor(((min%1440)+1440)%1440/60))+":"+pad(((min%60)+60)%60);
const nowMin = () => { const d=new Date(); return d.getHours()*60+d.getMinutes(); };
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => s.toLowerCase().trim();
const rulesFor = t => S.rules.filter(r => r.match && norm(t.title).includes(norm(r.match)));
function multiplier(){
  const xs = S.tasks.filter(t=>t.actual && t.dur).map(t=>t.actual/t.dur);
  if(xs.length<3) return null;
  return xs.reduce((a,b)=>a+b,0)/xs.length;
}
function toast(msg){
  const el=document.createElement("div"); el.className="toast"; el.textContent=msg; document.body.appendChild(el);
  setTimeout(()=>el.remove(),3200);
}

/* ---------- render ---------- */
function render(){
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===tab));
  const v = document.getElementById("view");
  if(tab==="today") v.innerHTML = viewToday();
  if(tab==="playbook") v.innerHTML = viewPlaybook();
  if(tab==="patterns") v.innerHTML = viewPatterns();
  const d = new Date();
  document.getElementById("title").innerHTML = tab==="today"
    ? d.toLocaleDateString(undefined,{weekday:"long"})+" <em>"+d.toLocaleDateString(undefined,{month:"short",day:"numeric"})+"</em>"
    : tab==="playbook" ? "Your playbook" : "Patterns <em>· last 14 days</em>";
}

function viewToday(){
  const k = today(), ci = S.checkins[k]||{};
  const tasks = S.tasks.filter(t=>t.date===k).sort((a,b)=>toMin(a.start)-toMin(b.start));
  const hasEx = S.tasks.some(t=>t.ex);
  let h = `<section class="checkin" aria-label="Daily check-in">
    <div><span class="lbl">Energy</span><span class="seg">${["low","steady","high"].map(e=>`<button data-act="energy" data-v="${e}" aria-pressed="${ci.energy===e}">${e[0].toUpperCase()+e.slice(1)}</button>`).join("")}</span></div>
    <div><span class="lbl">Slept</span><input class="sleep" id="sleep" type="number" min="0" max="14" step="0.5" value="${ci.sleep??""}" placeholder="7"> <span class="muted small">h</span></div>
    ${hasEx?`<button class="btn ghost small" data-act="clearex">Clear example data</button>`:""}
  </section>`;
  h += bannerHTML(tasks, ci);
  if(!tasks.length){
    return h + `<div class="card empty" style="margin-top:20px"><div class="what">Nothing planned yet</div>
      <div>Add the few blocks that matter today. When something doesn't happen, log why and set a fix so tomorrow goes better.</div>
      <div class="row"><button class="btn primary" data-act="add">Add a block</button><button class="btn" data-act="example">Load an example week</button></div></div>`;
  }
  return h + `<div class="grid"><section><div class="sechead"><h2>Day</h2><button class="btn primary small" data-act="add">Add block</button></div>${timelineHTML(tasks, ci)}</section>
    <aside class="side">${nowHTML(tasks)}${cuesHTML(tasks)}${scoreHTML(tasks)}</aside></div>`;
}

function bannerHTML(tasks, ci){
  const y = addDays(today(),-1);
  const missedY = S.tasks.filter(t=>t.date===y && t.status==="missed");
  const repeat = missedY.find(m => tasks.some(t=>norm(t.title)===norm(m.title)));
  if(repeat) return `<div class="banner"><b>Never miss twice.</b><span>You missed “${esc(repeat.title)}” yesterday${repeat.barrier?` (${BL[repeat.barrier].toLowerCase()})`:""}. Today, even the minimum version counts.</span></div>`;
  if(ci.energy==="low" || (ci.sleep && ci.sleep<6)) return `<div class="banner calm"><b>Low-fuel day.</b><span>High-energy blocks are dimmed. Do their minimum versions and protect one win.</span></div>`;
  return "";
}

function timelineHTML(tasks, ci){
  const starts = tasks.map(t=>toMin(t.start)), ends = tasks.map(t=>toMin(t.start)+t.dur);
  const from = Math.min(7*60, Math.floor(Math.min(...starts)/60)*60);
  const to = Math.max(22*60, Math.ceil(Math.max(...ends)/60)*60);
  const y = m => (m-from)/60*HOUR_PX;
  let h = `<div class="timeline" style="height:${y(to)+8}px">`;
  for(let m=from;m<=to;m+=60) h += `<div class="hour" style="top:${y(m)}px">${fmt(m)}</div>`;
  const n = nowMin();
  if(n>from && n<to){ h += `<div class="passed" style="height:${y(n)}px"></div><div class="nowline" style="top:${y(n)}px"></div>`; }
  // lanes for overlaps
  const lanes=[]; const pos={};
  tasks.forEach(t=>{ const s=toMin(t.start); let i=lanes.findIndex(e=>e<=s); if(i<0){i=lanes.length;lanes.push(0)} lanes[i]=s+t.dur; pos[t.id]=i; });
  const L = Math.max(1,lanes.length), lowDay = ci.energy==="low" || (ci.sleep && ci.sleep<6);
  tasks.forEach(t=>{
    const s=toMin(t.start), top=y(s)+1, ht=Math.max(26, t.dur/60*HOUR_PX-3);
    const left = `calc(56px + (100% - 64px - 34%) * ${pos[t.id]/L})`, width=`calc((100% - 64px - 34%) / ${L} - 4px)`;
    const cls = ["block", t.status==="done"||t.status==="min"?"done":"", t.status==="missed"?"missed":"", lowDay&&t.energy==="high"&&t.status==="open"?"dim":""].join(" ");
    const sub = t.status==="min" ? "Minimum version done" : t.status==="missed" ? "Missed"+(t.barrier?" · "+BL[t.barrier]:"") :
      lowDay&&t.energy==="high"&&t.minVersion ? "Try: "+t.minVersion : fmt(s)+"–"+fmt(s+t.dur);
    h += `<button class="${cls}" data-e="${t.energy}" data-act="task" data-id="${t.id}" style="top:${top}px;height:${ht}px;left:${left};width:${width}">
      <span class="t">${esc(t.title)}${t.ex?' <span class="chip ex">example</span>':""}</span>${ht>34?`<span class="m">${esc(sub)}</span>`:""}</button>`;
  });
  cuesFor(tasks).forEach(c=>{ if(c.at>=from) h += `<div class="cue" style="top:${y(c.at)}px" title="${esc(c.fix)}">${fmt(c.at)} ${esc(c.fix)}</div>`; });
  return h + `</div>`;
}

function cuesFor(tasks){
  const out=[];
  tasks.filter(t=>t.status==="open").forEach(t=>rulesFor(t).forEach(r=>{
    out.push({at: r.lead>=720 ? 21*60 : toMin(t.start)-r.lead, fix:r.fix, task:t.title, barrier:r.barrier, night:r.lead>=720});
  }));
  return out.sort((a,b)=>a.at-b.at);
}

function nowHTML(tasks){
  const n = nowMin();
  const cur = tasks.find(t=>t.status==="open" && toMin(t.start)<=n && n<toMin(t.start)+t.dur);
  const next = tasks.find(t=>t.status==="open" && toMin(t.start)>n);
  if(cur){
    const p = Math.round((n-toMin(cur.start))/cur.dur*100), left = toMin(cur.start)+cur.dur-n;
    return `<div class="card now"><h2>Now</h2><div class="what">${esc(cur.title)}</div>
      <div class="bar"><i style="width:${p}%"></i></div><div class="when">${left} min left · ends ${fmt(toMin(cur.start)+cur.dur)}</div>
      ${next?`<div class="small muted" style="margin-top:10px">Next: ${esc(next.title)} at ${next.start}</div>`:""}
      <div class="actions"><button class="btn small" data-act="task" data-id="${cur.id}">Log it</button></div></div>`;
  }
  if(next){
    const gap = toMin(next.start)-n;
    return `<div class="card now"><h2>Up next</h2><div class="what">${esc(next.title)}</div>
      <div class="when">in ${gap>=60?Math.floor(gap/60)+" h "+(gap%60)+" min":gap+" min"} · ${next.start}</div>
      ${gap<=10?`<div class="banner calm" style="margin-top:12px"><b>Transition.</b><span>Wrap up and stand up now.</span></div>`:""}
      ${next.minVersion?`<div class="small muted" style="margin-top:10px">Minimum version: ${esc(next.minVersion)}</div>`:""}</div>`;
  }
  const open = tasks.filter(t=>t.status==="open");
  return `<div class="card now"><h2>Now</h2><div class="what">${open.length?"Log what happened":"Day closed"}</div>
    <div class="small muted">${open.length?`${open.length} block${open.length>1?"s":""} still unlogged. Tap one on the timeline.`:"Everything is logged. Check Patterns to see what's working."}</div></div>`;
}

function cuesHTML(tasks){
  const cues = cuesFor(tasks), n=nowMin();
  if(!cues.length) return "";
  return `<div class="card"><h2>Prep cues</h2><ul class="list" style="margin-top:6px">${cues.map(c=>`<li style="${!c.night&&c.at<n?"opacity:.5":""}"><span class="time">${c.night?"Eve":fmt(c.at)}</span>
    <span style="flex:1;min-width:0">${esc(c.fix)}<div class="small muted">for ${esc(c.task)} · after “${BL[c.barrier]||"note"}”</div></span></li>`).join("")}</ul></div>`;
}

function scoreHTML(tasks){

  const mx = multiplier();
  return `<div class="card"><h2>Today</h2><ul class="list" style="margin-top:6px">
    <li><span style="flex:1">Followed through</span><span class="time">${done}/${tasks.length}</span></li>
    <li><span style="flex:1">Logged</span><span class="time">${logged}/${tasks.length}</span></li>
    ${mx?`<li><span style="flex:1">Your time multiplier</span><span class="time">${mx.toFixed(1)}×</span></li>`:""}
  </ul></div>`;
}

function viewPlaybook(){
  let h = `<p class="intro">Each rule comes from a miss. When a block's name contains the trigger word, the fix shows up as a prep cue before it. Rules that keep failing get flagged so you can swap the fix.</p>`;
  if(!S.rules.length) return h + `<div class="card empty" style="margin-top:16px"><div class="what">No rules yet</div><div>Mark a block as missed and pick a fix. It lands here.</div></div>`;
  h += `<div class="rules">`;
  S.rules.forEach(r=>{
    const tries = (r.wins||0)+(r.fails||0);
    const st = tries===0 ? `<span class="chip">Not tested yet</span>` : r.fails>=2 && r.fails>r.wins ? `<span class="chip warn">Not working · ${r.wins}/${tries}</span>` : `<span class="chip good">Worked ${r.wins}/${tries}</span>`;
    h += `<div class="card rule"><div class="if">If <b>${esc(r.match)}</b> · after “${BL[r.barrier]||r.barrier}”</div>
      <div class="then">${esc(r.fix)}</div>
      <div class="foot"><span class="small muted">${leadLabel(r.lead)}</span>${st}</div>
      <div class="actions" style="margin-top:12px"><button class="btn ghost small" data-act="delrule" data-id="${r.id}">Remove</button><button class="btn small" data-act="editrule" data-id="${r.id}">Edit</button></div></div>`;
  });
  return h + `</div>`;
}

function stats14(){
  const from = addDays(today(),-13);
  const ts = S.tasks.filter(t=>t.date>=from && t.date<=today() && t.status!=="open");
  const ok = t => t.status==="done"||t.status==="min";
  const rate = arr => arr.length ? Math.round(arr.filter(ok).length/arr.length*100) : null;
  const missed = ts.filter(t=>t.status==="missed");
  const barriers = {}; missed.forEach(t=>{ if(t.barrier) barriers[t.barrier]=(barriers[t.barrier]||0)+1; });
  const byE = {}; ["low","steady","high"].forEach(e=>byE[e]=rate(ts.filter(t=>S.checkins[t.date]?.energy===e)));
  const shortSleep = rate(ts.filter(t=>S.checkins[t.date]?.sleep && S.checkins[t.date].sleep<6));
  const goodSleep = rate(ts.filter(t=>S.checkins[t.date]?.sleep>=6));
  const byTask = {}; ts.forEach(t=>{ const k=t.title; byTask[k]=byTask[k]||{n:0,miss:0,b:{}}; byTask[k].n++; if(t.status==="missed"){byTask[k].miss++; if(t.barrier) byTask[k].b[t.barrier]=(byTask[k].b[t.barrier]||0)+1;} });
  return {ts, rate:rate(ts), missed, barriers, byE, shortSleep, goodSleep, byTask, mins: ts.filter(t=>t.status==="min").length};
}

function viewPatterns(){
  const s = stats14();
  if(s.ts.length<3) return `<div class="card empty" style="margin-top:20px"><div class="what">Not enough data yet</div><div>Log a few days of blocks (done, minimum version or missed) and patterns show up here.</div><div class="row"><button class="btn" data-act="example">Load an example week</button></div></div>`;
  const mx = multiplier();
  let h = `<div class="stats">
    <div class="card stat"><div class="v">${s.rate}%</div><div class="k">Follow-through (${s.ts.length} blocks logged)</div></div>
    <div class="card stat"><div class="v">${s.mins}</div><div class="k">Saved by the minimum version</div></div>
    <div class="card stat"><div class="v">${mx?mx.toFixed(1)+"×":"—"}</div><div class="k">${mx?"Actual time vs. planned. Plan bigger blocks.":"Log actual time on 3+ blocks to see this"}</div></div></div>`;
  // insights
  const ins=[];
  const worst = Object.entries(s.byTask).filter(([,v])=>v.miss>=2).sort((a,b)=>b[1].miss-a[1].miss)[0];
  if(worst){ const tb = Object.entries(worst[1].b).sort((a,b)=>b[1]-a[1])[0]; ins.push(`You missed <b>${esc(worst[0])}</b> ${worst[1].miss} of ${worst[1].n} times${tb?`, mostly from <b>${BL[tb[0]].toLowerCase()}</b>`:""}.${S.rules.some(r=>norm(worst[0]).includes(norm(r.match)))?" A rule is in place; watch whether it holds.":" Set a fix next time you log it."}`); }
  if(s.shortSleep!=null && s.goodSleep!=null && s.goodSleep-s.shortSleep>=15) ins.push(`On days after under 6 h of sleep you follow through <b>${s.shortSleep}%</b> of the time, compared with <b>${s.goodSleep}%</b> otherwise. Sleep is a lever.`);
  if(s.byE.low!=null && s.byE.high!=null && s.byE.high-s.byE.low>=15) ins.push(`Low-energy days drop you to <b>${s.byE.low}%</b>. Plan those days around minimum versions instead of full blocks.`);
  const topB = Object.entries(s.barriers).sort((a,b)=>b[1]-a[1])[0];
  if(topB && topB[1]>=2) ins.push(`Your most common barrier is <b>${BL[topB[0]].toLowerCase()}</b> (${topB[1]}×). Fix the system for that one first.`);
  if(mx && mx>1.2) ins.push(`Blocks take <b>${mx.toFixed(1)}×</b> longer than you plan. Your 60-minute tasks are really ${Math.round(60*mx)}-minute tasks.`);
  h += `<div class="two"><div class="card"><h2>What the data says</h2><div style="margin-top:6px">${ins.map(i=>`<div class="insight"><span class="dot"></span><span>${i}</span></div>`).join("")||'<div class="muted small" style="margin-top:8px">No strong patterns yet.</div>'}</div>
    ${sampler?`<div class="actions" style="justify-content:flex-start"><button class="btn primary small" data-act="coach" id="coachbtn">Get a coach review</button></div><div class="coachtext" id="coachout"></div>`:""}</div>`;
  const bmax = Math.max(1,...Object.values(s.barriers));
  h += `<div class="card"><h2>Why things didn't happen</h2><div style="margin-top:10px">${Object.entries(s.barriers).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<div class="hbar"><span>${BL[k]}</span><span class="track"><i style="width:${n/bmax*100}%"></i></span><span class="n">${n}</span></div>`).join("")||'<div class="muted small">No misses logged.</div>'}</div>
    <h2 style="margin-top:18px">Follow-through by energy</h2><div style="margin-top:10px">${["low","steady","high"].map(e=>`<div class="hbar acc"><span>${e[0].toUpperCase()+e.slice(1)} energy</span><span class="track"><i style="width:${s.byE[e]??0}%"></i></span><span class="n">${s.byE[e]==null?"—":s.byE[e]+"%"}</span></div>`).join("")}</div></div></div>`;
  return h;
}

/* ---------- sheets ---------- */
function openSheet(html){ document.getElementById("layer").innerHTML = `<div class="overlay" data-act="close"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`; const f=document.querySelector(".sheet input, .sheet button"); f&&f.focus(); }
function closeSheet(){ document.getElementById("layer").innerHTML=""; }

function sheetAdd(t){
  const e = t||{title:"",start:fmt(Math.ceil((nowMin()+15)/15)*15),dur:60,energy:"med",minVersion:""};
  const mx = multiplier();
  openSheet(`<h3>${t?"Edit block":"Add a block"}</h3><div class="small muted">Keep it to what matters. Every block gets a minimum version for bad days.</div>
    <div class="field"><label for="f-title">What</label><input id="f-title" value="${esc(e.title)}" placeholder="Gym"></div>
    <div class="row"><div class="field"><label for="f-start">Start</label><input id="f-start" type="time" value="${e.start}"></div>
    <div class="field"><label for="f-dur">Minutes</label><input id="f-dur" type="number" min="5" step="5" value="${e.dur}"></div>

    ${mx&&mx>1.15?`<div class="small muted" style="margin-top:6px" id="f-hint">You usually need ${mx.toFixed(1)}× your estimate.</div>`:""}

    <div class="actions">${t?`<button class="btn ghost" data-act="deltask" data-id="${t.id}">Delete</button><span class="spacer"></span>`:""}<button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="savetask" data-id="${t?t.id:""}">Save</button></div>`);
}

function sheetTask(t){
  const rs = rulesFor(t);
  openSheet(`<h3>${esc(t.title)}</h3><div class="small muted">${t.start}–${fmt(toMin(t.start)+t.dur)} · ${ENERGY[t.energy]} energy${t.status!=="open"?" · logged as "+({done:"done",min:"minimum version",missed:"missed"})[t.status]:""}</div>
    ${rs.length?`<div class="banner calm" style="margin-top:14px"><b>Your rule:</b><span>${rs.map(r=>esc(r.fix)+" ("+leadLabel(r.lead)+")").join("; ")}</span></div>`:""}
    <div class="field">How did it go?</div>
    <div class="fixes">
      <button class="pick" data-act="mark" data-v="done" data-id="${t.id}">Done</button>
      <button class="pick" data-act="mark" data-v="min" data-id="${t.id}">Did the minimum version${t.minVersion?": "+esc(t.minVersion):""}</button>
      <button class="pick" data-act="mark" data-v="missed" data-id="${t.id}">Didn't happen</button>
    </div>
    <div class="actions"><button class="btn ghost" data-act="tomorrow" data-id="${t.id}">Move to tomorrow</button><span class="spacer"></span>${t.status!=="open"?`<button class="btn ghost" data-act="reopen" data-id="${t.id}">Reset</button>`:""}<button class="btn" data-act="edit" data-id="${t.id}">Edit</button></div>`);
}

function sheetActual(t){
  openSheet(`<h3>Nice. How long did it take?</h3><div class="small muted">You planned ${t.dur} min. This trains your time estimates.</div>
    <div class="chips" style="margin-top:14px">${[0.5,1,1.5,2].map(f=>`<button class="pick" data-act="actual" data-id="${t.id}" data-v="${Math.round(t.dur*f)}">${f===1?"As planned":Math.round(t.dur*f)+" min"}</button>`).join("")}</div>
    <div class="actions"><button class="btn ghost" data-act="close">Skip</button></div>`);
}

let miss = null;
function sheetMiss(t, rule){
  miss = rule ? (miss && miss.ruleId===rule.id ? miss : {id:null, barrier:rule.barrier, note:"", fix:rule.fix, lead:rule.lead, match:rule.match, ruleId:rule.id, ai:[]})
              : miss && miss.id===t.id ? miss : {id:t.id, barrier:null, note:"", fix:"", lead:60, match:norm(t.title).split(" ")[0], ai:[]};
  const sugg = miss.barrier ? (FIXES[miss.barrier]||[]).concat(miss.ai) : [];
  openSheet(`<h3>${rule?"Edit rule":"What got in the way?"}</h3><div class="small muted">${rule?"Adjust the fix or when it fires.":"No judgement. This is data. Pick the closest reason, then set one fix for next time."}</div>
    ${rule?"":`<div class="chips" style="margin-top:14px">${BARRIERS.map(b=>`<button class="pick" data-act="barrier" data-v="${b.k}" aria-pressed="${miss.barrier===b.k}">${b.l}</button>`).join("")}</div>
    <div class="field"><label for="m-note">Detail (optional)</label><input id="m-note" value="${esc(miss.note)}" placeholder="Big lunch at 2pm, felt heavy"></div>`}
    ${miss.barrier?`<div class="field">Fix for next time</div><div class="fixes">${sugg.map(([f,l])=>`<button class="pick" data-act="fix" data-v="${esc(f)}" data-lead="${l}" aria-pressed="${miss.fix===f}">${esc(f)} <span class="muted small">· ${leadLabel(l)}</span></button>`).join("")}</div>
      ${sampler&&!rule?`<button class="btn ghost small" style="margin-top:6px" data-act="aifix" id="aibtn">Ask the coach for ideas</button>`:""}
      <div class="field"><label for="m-fix">Or write your own</label><input id="m-fix" value="${esc(miss.fix)}" placeholder="Eat 1 hour before"></div>
      <div class="row"><div class="field"><label for="m-lead">Remind me</label><select id="m-lead">${LEADS.map(l=>`<option value="${l}" ${+miss.lead===l?"selected":""}>${leadLabel(l)}</option>`).join("")}</select></div>
      <div class="field"><label for="m-match">Applies to blocks containing</label><input id="m-match" value="${esc(miss.match)}"></div></div>`:""}
    <div class="actions">${rule?"":`<button class="btn ghost" data-act="savemiss" data-v="nofix">Log without a fix</button><span class="spacer"></span>`}<button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="savemiss" ${miss.barrier?"":"disabled"}>${rule?"Save rule":"Save fix"}</button></div>`);
}
function readMiss(){
  const g=id=>document.getElementById(id);
  if(g("m-note")) miss.note=g("m-note").value;
  if(g("m-fix")) miss.fix=g("m-fix").value.trim();
  if(g("m-lead")) miss.lead=+g("m-lead").value;
  if(g("m-match")) miss.match=g("m-match").value.trim();
}

/* ---------- actions ---------- */
function scoreRules(t, ok){
  rulesFor(t).forEach(r=>{ if(t.date>=r.created){ ok ? r.wins=(r.wins||0)+1 : r.fails=(r.fails||0)+1; } });
}
const find = id => S.tasks.find(t=>t.id===id);

document.addEventListener("click", async ev=>{
  const el = ev.target.closest("[data-act]"); if(!el) return;
  const a = el.dataset.act, id = el.dataset.id, v = el.dataset.v;
  if(a==="close"){ if(ev.target===el || el.tagName==="BUTTON") closeSheet(); return; }
  ev.stopPropagation();
  if(a==="energy"){ const k=today(); S.checkins[k]={...(S.checkins[k]||{}),energy:v}; save(); render(); }
  if(a==="add") sheetAdd();
  if(a==="task") sheetTask(find(id));
  if(a==="edit") sheetAdd(find(id));
  if(a==="savetask"){
    const g=x=>document.getElementById(x).value;
    if(!g("f-title").trim()){ document.getElementById("f-title").focus(); return; }
    const data={title:g("f-title").trim(),start:g("f-start")||"09:00",dur:Math.max(5,+g("f-dur")||30),energy:g("f-energy"),minVersion:g("f-min").trim()};
    if(id) Object.assign(find(id),data); else S.tasks.push({id:uid(),date:today(),status:"open",...data});
    save(); closeSheet(); render();
  }
  if(a==="deltask"){ S.tasks=S.tasks.filter(t=>t.id!==id); save(); closeSheet(); render(); }
  if(a==="reopen"){ const t=find(id); t.status="open"; delete t.barrier; delete t.actual; save(); closeSheet(); render(); }
  if(a==="tomorrow"){ const t=find(id); S.tasks.push({...t,id:uid(),date:addDays(t.date,1),status:"open",barrier:undefined,actual:undefined}); if(t.status==="open") S.tasks=S.tasks.filter(x=>x.id!==id); save(); closeSheet(); render(); toast("Moved to tomorrow at "+t.start); }
  if(a==="mark"){
    const t=find(id);
    if(v==="missed"){ miss=null; sheetMiss(t); return; }
    t.status=v; scoreRules(t,true); save(); render();
    if(v==="done") sheetActual(t); else { closeSheet(); toast("Minimum version counts. Momentum kept."); }
  }
  if(a==="actual"){ find(id).actual=+v; save(); closeSheet(); render(); toast("Logged."); }
  if(a==="barrier"){ readMiss(); miss.barrier=v; miss.fix=""; miss.ai=[]; sheetMiss(find(miss.id)); }
  if(a==="fix"){ readMiss(); miss.fix=v; miss.lead=+el.dataset.lead; sheetMiss(find(miss.id), miss.ruleId?S.rules.find(r=>r.id===miss.ruleId):null); }
  if(a==="aifix"){
    readMiss(); el.disabled=true; el.textContent="Thinking…";
    const t=find(miss.id);
    const hist=S.tasks.filter(x=>norm(x.title)===norm(t.title)&&x.status==="missed").map(x=>BL[x.barrier]).filter(Boolean);
    try{
      const r = await sampler.json(`You are a concise ADHD performance coach for high achievers. A planned block didn't happen.
Block: "${t.title}" at ${t.start}, ${t.dur} min, energy needed: ${t.energy}.
Reason: ${BL[miss.barrier]}. Detail: ${miss.note||"none"}. Past reasons for this block: ${hist.join(", ")||"none"}.
Suggest 3 specific, small, practical fixes the person can set up in advance (each under 9 words, imperative, no fluff), with how many minutes before the block a reminder should fire (one of ${LEADS.join(", ")}; 720 means the night before).
Return JSON only: {"fixes":[{"fix":"...","lead":60}]}`, {modelTier:"quick"});
      miss.ai = (r.fixes||[]).slice(0,3).map(f=>[String(f.fix),LEADS.includes(+f.lead)?+f.lead:60]);
      sheetMiss(t);
    }catch(e){ el.textContent = e?.code==="not_granted"?"Coach not allowed":"Coach unavailable right now"; }
  }
  if(a==="savemiss"){
    readMiss();
    if(miss.ruleId){ Object.assign(S.rules.find(r=>r.id===miss.ruleId),{fix:miss.fix,lead:miss.lead,match:miss.match}); save(); closeSheet(); render(); toast("Rule updated."); return; }
    const t=find(miss.id);
    if(!miss.barrier && v!=="nofix") return;
    t.status="missed"; t.barrier=miss.barrier||undefined; t.note=miss.note; scoreRules(t,false);
    if(v!=="nofix" && miss.fix){
      const existing = S.rules.find(r=>norm(r.match)===norm(miss.match) && norm(r.fix)===norm(miss.fix));
      if(!existing) S.rules.push({id:uid(),match:miss.match||norm(t.title),barrier:miss.barrier,fix:miss.fix,lead:miss.lead,created:addDays(today(),1),wins:0,fails:0});
      toast("Rule added. You'll see a prep cue "+leadLabel(miss.lead)+".");
    }
    save(); closeSheet(); render();
  }
  if(a==="delrule"){ S.rules=S.rules.filter(r=>r.id!==id); save(); render(); }
  if(a==="editrule"){ miss=null; sheetMiss(null, S.rules.find(r=>r.id===id)); }
  if(a==="example"){ loadExample(); save(); tab="today"; render(); }
  if(a==="clearex"){ S.tasks=S.tasks.filter(t=>!t.ex); S.rules=S.rules.filter(r=>!r.ex); Object.keys(S.checkins).forEach(k=>{if(S.checkins[k].ex) delete S.checkins[k]}); save(); render(); }
  if(a==="coach"){
    const s=stats14(), out=document.getElementById("coachout"); el.disabled=true; el.textContent="Reviewing…";
    const summary={followThrough:s.rate, minimumVersions:s.mins, barriers:Object.fromEntries(Object.entries(s.barriers).map(([k,n])=>[BL[k],n])), byEnergy:s.byE, shortSleepRate:s.shortSleep, normalSleepRate:s.goodSleep, timeMultiplier:multiplier(), perBlock:Object.fromEntries(Object.entries(s.byTask).map(([k,x])=>[k,{planned:x.n,missed:x.miss}])), rules:S.rules.map(r=>({if:r.match,fix:r.fix,worked:r.wins||0,failed:r.fails||0}))};
    try{
      await sampler(`You are a direct, warm ADHD coach for a high achiever. Review 14 days of planner data and write a weekly review.
Format: three short paragraphs labelled "Working:", "Not working:", "Change this week:". Max 110 words total. Plain text, no markdown, no shaming. Be specific with numbers.
Data: ${JSON.stringify(summary)}`, {modelTier:"default", cache:false, onText:({text})=>{ out.textContent=text; }});
      el.textContent="Refresh review"; el.disabled=false;
    }catch(e){ el.disabled=false; el.textContent="Get a coach review"; out.textContent = e?.code==="not_granted"?"The coach needs permission to run. Allow it from this page's permissions.":"The coach is unavailable right now. Try again in a minute."; }
  }
});
document.addEventListener("change", ev=>{
  if(ev.target.id==="sleep"){ const k=today(); const n=parseFloat(ev.target.value); S.checkins[k]={...(S.checkins[k]||{}),sleep:isNaN(n)?undefined:n}; save(); render(); }
});
document.querySelector(".tabs").addEventListener("click", ev=>{
  const b=ev.target.closest("button"); if(!b) return; tab=b.dataset.tab;
  try{localStorage.setItem(LKEY+".tab",tab)}catch(e){}
  render();
});
document.addEventListener("keydown", ev=>{ if(ev.key==="Escape") closeSheet(); });

/* ---------- example data ---------- */
function loadExample(){
  const T=today(), mk=(d,title,start,dur,energy,minVersion,status,extra={})=>({id:uid(),date:addDays(T,d),title,start,dur,energy,minVersion,status,ex:true,...extra});
  const days=[[-6,"steady",7],[-5,"low",5.5],[-4,"steady",7.5],[-3,"high",8],[-2,"low",5],[-1,"steady",6.5]];
  days.forEach(([d,energy,sleep])=>S.checkins[addDays(T,d)]={energy,sleep,ex:true});
  const gymOut={"-6":["done"],"-5":["missed","energy"],"-4":["done"],"-3":["done"],"-2":["missed","bloated"],"-1":["min"]};
  const deepOut={"-6":["done",130],"-5":["missed","overwhelm"],"-4":["done",120],"-3":["done",100],"-2":["missed","sleep"],"-1":["done",110]};
  days.forEach(([d])=>{
    const g=gymOut[d], dp=deepOut[d];
    S.tasks.push(mk(d,"Deep work: Q4 strategy","09:00",90,"high","25 min outline only",dp[0],dp[0]==="done"?{actual:dp[1]}:{barrier:dp[1]}));
    S.tasks.push(mk(d,"Inbox + admin","14:00",45,"med","Reply to the 3 most urgent",d===-3?"missed":"done",d===-3?{barrier:"time"}:{actual:60}));
    S.tasks.push(mk(d,"Gym","18:00",60,"high","20-minute walk",g[0],g[1]?{barrier:g[1]}:{}));
  });
  S.rules.push({id:uid(),ex:true,match:"gym",barrier:"energy",fix:"Small snack with protein",lead:60,created:addDays(T,-4),wins:2,fails:1});
  S.rules.push({id:uid(),ex:true,match:"gym",barrier:"bloated",fix:"Keep lunch light on gym days",lead:240,created:addDays(T,-1),wins:1,fails:0});
  S.rules.push({id:uid(),ex:true,match:"deep work",barrier:"overwhelm",fix:"Write the first 2-minute step",lead:720,created:addDays(T,-4),wins:2,fails:1});
  [["Morning pages","07:30",20,"low","5 lines"],["Deep work: Q4 strategy","09:00",90,"high","25 min outline only"],["Lunch away from desk","12:30",45,"low",""],
   ["Inbox + admin","14:00",45,"med","Reply to the 3 most urgent"],["Gym","18:00",60,"high","20-minute walk"],["Plan tomorrow","21:30",15,"low","Pick the top 1"]]
   .forEach(([title,start,dur,energy,mv])=>S.tasks.push(mk(0,title,start,dur,energy,mv,"open")));
}

render();
setInterval(()=>{ if(tab==="today" && !document.querySelector(".overlay")) render(); }, 60000);
</script>
